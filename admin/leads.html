<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Lead Dashboard | Bret's Mulching Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .leads-filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .leads-filters select,
    .leads-filters input {
      padding: 0.5rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
    }

    .leads-table-wrapper {
      overflow-x: auto;
    }

    .lead-actions {
      display: flex;
      gap: 0.5rem;
    }

    .lead-actions button {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    .lead-actions .btn-view {
      background: var(--color-cream);
      color: var(--color-text);
    }

    .lead-actions .btn-delete {
      background: #ffebee;
      color: #d32f2f;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: var(--radius-lg);
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--color-text-muted);
    }

    .lead-detail-row {
      display: flex;
      border-bottom: 1px solid var(--color-border);
      padding: 0.75rem 0;
    }

    .lead-detail-label {
      font-weight: 600;
      width: 140px;
      flex-shrink: 0;
      color: var(--color-text-light);
    }

    .lead-detail-value {
      flex: 1;
    }

    .notes-textarea {
      width: 100%;
      min-height: 100px;
      padding: 0.75rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      margin-top: 1rem;
      font-family: inherit;
      resize: vertical;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--color-text-muted);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      opacity: 0.3;
    }
  </style>
</head>
<body style="background: var(--color-cream);">
  <!-- Admin Header -->
  <header class="admin-header">
    <div class="admin-header__inner">
      <div>
        <h1 style="font-size: 1.25rem; margin: 0;">Lead Dashboard</h1>
        <p style="font-size: 0.875rem; opacity: 0.8; margin: 0;">Bret's Mulching</p>
      </div>
      <a href="../index.html" style="color: white; font-size: 0.875rem;">View Site &rarr;</a>
    </div>
  </header>

  <div class="admin-container">
    <!-- Stats -->
    <div class="admin-stats" id="stats">
      <div class="admin-stat">
        <div class="admin-stat__value" id="stat-total">0</div>
        <div class="admin-stat__label">Total Leads</div>
      </div>
      <div class="admin-stat">
        <div class="admin-stat__value" id="stat-new">0</div>
        <div class="admin-stat__label">New</div>
      </div>
      <div class="admin-stat">
        <div class="admin-stat__value" id="stat-contacted">0</div>
        <div class="admin-stat__label">Contacted</div>
      </div>
      <div class="admin-stat">
        <div class="admin-stat__value" id="stat-quoted">0</div>
        <div class="admin-stat__label">Quoted</div>
      </div>
      <div class="admin-stat">
        <div class="admin-stat__value" id="stat-won">0</div>
        <div class="admin-stat__label">Won</div>
      </div>
    </div>

    <!-- Filters & Actions -->
    <div class="leads-filters">
      <select id="filter-status">
        <option value="">All Statuses</option>
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="quoted">Quoted</option>
        <option value="won">Won</option>
        <option value="lost">Lost</option>
      </select>
      <select id="filter-source">
        <option value="">All Sources</option>
        <option value="facebook">Facebook</option>
        <option value="nextdoor">Nextdoor</option>
        <option value="google">Google</option>
        <option value="yard-sign">Yard Sign</option>
        <option value="referral">Referral</option>
      </select>
      <button class="btn btn--primary btn--small" onclick="exportLeadsToCSV()">Export CSV</button>
      <button class="btn btn--secondary btn--small" onclick="addTestLead()">Add Test Lead</button>
    </div>

    <!-- Leads Table -->
    <div class="leads-table-wrapper">
      <div class="leads-table" id="leads-table">
        <!-- Table will be populated by JavaScript -->
      </div>
    </div>
  </div>

  <!-- Lead Detail Modal -->
  <div class="modal" id="lead-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Lead Details</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="modal-body">
        <!-- Content populated by JavaScript -->
      </div>
    </div>
  </div>

  <script src="../js/form-handler.js"></script>
  <script>
    const LEADS_STORAGE_KEY = 'brets_mulching_leads';
    let currentLeadId = null;

    document.addEventListener('DOMContentLoaded', function() {
      renderLeads();
      updateStats();

      // Filter listeners
      document.getElementById('filter-status').addEventListener('change', renderLeads);
      document.getElementById('filter-source').addEventListener('change', renderLeads);
    });

    function getLeads() {
      const stored = localStorage.getItem(LEADS_STORAGE_KEY);
      return stored ? JSON.parse(stored) : [];
    }

    function updateStats() {
      const leads = getLeads();
      document.getElementById('stat-total').textContent = leads.length;
      document.getElementById('stat-new').textContent = leads.filter(l => l.status === 'new').length;
      document.getElementById('stat-contacted').textContent = leads.filter(l => l.status === 'contacted').length;
      document.getElementById('stat-quoted').textContent = leads.filter(l => l.status === 'quoted').length;
      document.getElementById('stat-won').textContent = leads.filter(l => l.status === 'won').length;
    }

    function renderLeads() {
      const container = document.getElementById('leads-table');
      let leads = getLeads();

      // Apply filters
      const statusFilter = document.getElementById('filter-status').value;
      const sourceFilter = document.getElementById('filter-source').value;

      if (statusFilter) {
        leads = leads.filter(l => l.status === statusFilter);
      }
      if (sourceFilter) {
        leads = leads.filter(l => l.data.source === sourceFilter);
      }

      if (leads.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
            </svg>
            <h3>No leads yet</h3>
            <p>When visitors submit quote requests, they'll appear here.</p>
          </div>
        `;
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Name</th>
              <th>Contact</th>
              <th>Property Size</th>
              <th>Source</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
      `;

      leads.forEach(lead => {
        const date = new Date(lead.createdAt).toLocaleDateString();
        html += `
          <tr>
            <td>${date}</td>
            <td><strong>${lead.data.name || '-'}</strong></td>
            <td>
              ${lead.data.phone ? `<a href="tel:${lead.data.phone}">${lead.data.phone}</a><br>` : ''}
              ${lead.data.email ? `<a href="mailto:${lead.data.email}">${lead.data.email}</a>` : ''}
            </td>
            <td>${lead.data.propertySize || '-'}</td>
            <td>${lead.data.source || '-'}</td>
            <td>
              <select class="status-select" onchange="updateStatus('${lead.id}', this.value)" style="padding: 0.25rem;">
                <option value="new" ${lead.status === 'new' ? 'selected' : ''}>New</option>
                <option value="contacted" ${lead.status === 'contacted' ? 'selected' : ''}>Contacted</option>
                <option value="quoted" ${lead.status === 'quoted' ? 'selected' : ''}>Quoted</option>
                <option value="won" ${lead.status === 'won' ? 'selected' : ''}>Won</option>
                <option value="lost" ${lead.status === 'lost' ? 'selected' : ''}>Lost</option>
              </select>
            </td>
            <td>
              <div class="lead-actions">
                <button class="btn-view" onclick="viewLead('${lead.id}')">View</button>
                <button class="btn-delete" onclick="deleteLead('${lead.id}')">Delete</button>
              </div>
            </td>
          </tr>
        `;
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function updateStatus(id, status) {
      const leads = getLeads();
      const index = leads.findIndex(l => l.id === id);
      if (index !== -1) {
        leads[index].status = status;
        leads[index].updatedAt = new Date().toISOString();
        localStorage.setItem(LEADS_STORAGE_KEY, JSON.stringify(leads));
        updateStats();
      }
    }

    function viewLead(id) {
      const leads = getLeads();
      const lead = leads.find(l => l.id === id);
      if (!lead) return;

      currentLeadId = id;

      document.getElementById('modal-title').textContent = lead.data.name || 'Lead Details';

      let html = '';

      const details = [
        ['Type', lead.type],
        ['Date', new Date(lead.createdAt).toLocaleString()],
        ['Name', lead.data.name],
        ['Phone', lead.data.phone ? `<a href="tel:${lead.data.phone}">${lead.data.phone}</a>` : '-'],
        ['Email', lead.data.email ? `<a href="mailto:${lead.data.email}">${lead.data.email}</a>` : '-'],
        ['Address', lead.data.address || '-'],
        ['Property Size', lead.data.propertySize || '-'],
        ['Services', (lead.data.services || []).join(', ') || '-'],
        ['Source', lead.data.source || '-'],
        ['Description', lead.data.description || lead.data.message || '-']
      ];

      details.forEach(([label, value]) => {
        html += `
          <div class="lead-detail-row">
            <div class="lead-detail-label">${label}</div>
            <div class="lead-detail-value">${value}</div>
          </div>
        `;
      });

      html += `
        <div style="margin-top: 1.5rem;">
          <label style="font-weight: 600;">Notes</label>
          <textarea class="notes-textarea" id="lead-notes" placeholder="Add notes about this lead...">${lead.notes || ''}</textarea>
          <button class="btn btn--primary btn--small" style="margin-top: 0.5rem;" onclick="saveNotes()">Save Notes</button>
        </div>
      `;

      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('lead-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('lead-modal').classList.remove('active');
      currentLeadId = null;
    }

    function saveNotes() {
      if (!currentLeadId) return;
      const notes = document.getElementById('lead-notes').value;
      const leads = getLeads();
      const index = leads.findIndex(l => l.id === currentLeadId);
      if (index !== -1) {
        leads[index].notes = notes;
        leads[index].updatedAt = new Date().toISOString();
        localStorage.setItem(LEADS_STORAGE_KEY, JSON.stringify(leads));
        alert('Notes saved!');
      }
    }

    function deleteLead(id) {
      if (!confirm('Are you sure you want to delete this lead?')) return;
      const leads = getLeads().filter(l => l.id !== id);
      localStorage.setItem(LEADS_STORAGE_KEY, JSON.stringify(leads));
      renderLeads();
      updateStats();
    }

    function addTestLead() {
      const testLead = {
        id: 'lead_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        type: 'quote',
        status: 'new',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        notes: '',
        data: {
          name: 'Test Customer',
          email: 'test@example.com',
          phone: '(555) 555-5555',
          address: '123 Test Street, Anytown, ST 12345',
          propertySize: 'one-to-two',
          services: ['forestry-mulching', 'fence-line'],
          description: 'This is a test lead to demonstrate the dashboard functionality.',
          source: 'facebook',
          preferredContact: 'phone'
        }
      };

      const leads = getLeads();
      leads.unshift(testLead);
      localStorage.setItem(LEADS_STORAGE_KEY, JSON.stringify(leads));
      renderLeads();
      updateStats();
    }

    function exportLeadsToCSV() {
      const leads = getLeads();
      if (leads.length === 0) {
        alert('No leads to export');
        return;
      }

      const headers = ['Date', 'Type', 'Status', 'Name', 'Email', 'Phone', 'Address', 'Property Size', 'Services', 'Source', 'Description', 'Notes'];

      const rows = leads.map(lead => [
        new Date(lead.createdAt).toLocaleDateString(),
        lead.type,
        lead.status,
        lead.data.name || '',
        lead.data.email || '',
        lead.data.phone || '',
        lead.data.address || '',
        lead.data.propertySize || '',
        (lead.data.services || []).join('; '),
        lead.data.source || '',
        (lead.data.description || lead.data.message || '').replace(/,/g, ';'),
        (lead.notes || '').replace(/,/g, ';')
      ]);

      const csv = [headers, ...rows].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `leads-export-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // Close modal on overlay click
    document.getElementById('lead-modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    // Close modal on escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
